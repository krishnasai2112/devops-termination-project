replicaCount: 2

image:
  repository: devops-flask-app
  tag: v3
  pullPolicy: Never

service:
  type: ClusterIP
  port: 5000

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50

monitoring:
  enabled: true
  path: /metrics
