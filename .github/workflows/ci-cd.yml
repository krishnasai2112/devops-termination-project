name: Flask DevOps CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-scan:
    name: Test, Build and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt

      - name: Run Flask unit tests
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker build -t devops-flask-app:ci .

      - name: Verify container health
        run: |
          docker run -d --name flask-ci -p 18080:5000 devops-flask-app:ci
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs flask-ci
          exit 1

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-flask-app:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
